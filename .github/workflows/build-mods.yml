name: Build D2R Mobile Mods

on:
  workflow_dispatch:
    inputs:
      shell_tag:
        description: "基础 IPA Release 标签"
        default: "v1.0.18-build.10.1"

      shell_asset:
        description: "基础 IPA 文件名，iOS 26 使用不带 ios18 后缀的版本"
        default: "D2RMobile-v1.0.18-build.10.1.ipa"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180

    env:
      SHELL_TAG: ${{ inputs.shell_tag }}
      SHELL_ASSET: ${{ inputs.shell_asset }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 创建目录
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path input, resources, dist | Out-Null
          New-Item -ItemType Directory -Force -Path resources\extracted | Out-Null

      - name: 下载基础 IPA
        shell: pwsh
        run: |
          $url = "https://github.com/jiayx/d2r-mobile-build/releases/download/${env:SHELL_TAG}/${env:SHELL_ASSET}"
          Write-Host "下载基础 IPA：$url"
          Invoke-WebRequest -Uri $url -OutFile "input\base.ipa"

          if ((Get-Item "input\base.ipa").Length -lt 10MB) {
            throw "下载到的 base.ipa 太小，可能是 404 页面"
          }

      - name: 从 Google Drive 获取资源
        shell: pwsh
        run: |
          python -m pip install --upgrade pip gdown

          gdown `
            --folder "https://drive.google.com/drive/folders/1lfjUghi54ohyDxYEtNuEjtGUZyGovaIA" `
            -O "resources\gdrive" `
            --remaining-ok

          @'
          import hashlib
          import os
          import re
          import shutil
          import zipfile
          from pathlib import Path

          root = Path("resources")
          download_dir = root / "gdrive"
          extracted = root / "extracted"
          extracted.mkdir(parents=True, exist_ok=True)

          part_names = [
              "D2R-Mobile-Resources.zip.001",
              "D2R-Mobile-Resources.zip.002",
              "D2R-Mobile-Resources.zip.003",
          ]

          wanted = {
              "00-00000005.data",
              "build_manifest.psv",
          }

          def find_one(filename):
              matches = list(download_dir.rglob(filename))
              if not matches:
                  return None
              return matches[0]

          def sha256_file(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  while True:
                      chunk = f.read(16 * 1024 * 1024)
                      if not chunk:
                          break
                      h.update(chunk)
              return h.hexdigest().lower()

          def verify_if_checksum_available():
              hashes = {}

              for checksum_file in download_dir.rglob("*SHA256SUMS*.txt"):
                  try:
                      text = checksum_file.read_text(encoding="utf-8", errors="ignore")
                  except Exception:
                      continue

                  for line in text.splitlines():
                      m = re.match(
                          r"^\s*([0-9a-fA-F]{64})\s+\*?(.+?)\s*$",
                          line
                      )
                      if not m:
                          continue
                      digest = m.group(1).lower()
                      name = os.path.basename(m.group(2).strip())
                      hashes.setdefault(name, digest)

              for name in sorted(wanted):
                  target = extracted / name
                  expected = hashes.get(name)

                  if not expected:
                      print(f"没有找到 {name} 的 SHA256，跳过该校验")
                      continue

                  actual = sha256_file(target)
                  print(f"{name} SHA256:")
                  print(f"  预期：{expected}")
                  print(f"  实际：{actual}")

                  if actual != expected:
                      raise SystemExit(f"{name} SHA256 校验失败")

                  print(f"{name} SHA256 OK")

          parts = [find_one(name) for name in part_names]

          if all(parts):
              print("发现三个 ZIP 分卷，开始合并")

              merged = root / "D2R-Mobile-Resources.zip"
              with open(merged, "wb") as out:
                  for part in parts:
                      print("合并:", part)
                      with open(part, "rb") as src:
                          shutil.copyfileobj(src, out, 16 * 1024 * 1024)

              found = set()
              with zipfile.ZipFile(merged) as z:
                  for info in z.infolist():
                      base = os.path.basename(info.filename)
                      if base in wanted:
                          target = extracted / base
                          with z.open(info) as src, open(target, "wb") as dst:
                              shutil.copyfileobj(src, dst, 16 * 1024 * 1024)
                          print("已提取:", info.filename)
                          found.add(base)

              missing = wanted - found
              if missing:
                  raise SystemExit(
                      "资源 ZIP 中缺少: " + ", ".join(sorted(missing))
                  )

              merged.unlink(missing_ok=True)

          else:
              print("没有发现完整 ZIP 分卷，尝试直接寻找已解压文件")

              for name in wanted:
                  source = find_one(name)
                  if source is None:
                      raise SystemExit(
                          "Google Drive 目录中缺少: " + name
                      )
                  shutil.copy2(source, extracted / name)
                  print("已复制:", source)

          verify_if_checksum_available()
          shutil.rmtree(download_dir, ignore_errors=True)

          print("资源准备完成")
          print("PHONE_DATA=" + str((extracted / "00-00000005.data").resolve()))
          print("MANIFEST=" + str((extracted / "build_manifest.psv").resolve()))
          '@ | python -

      - name: 安装 LLVM
        shell: pwsh
        run: |
          choco install llvm --yes

          $llvmBin = "C:\Program Files\LLVM\bin"

          if (!(Test-Path "$llvmBin\clang.exe")) {
              $clang = Get-Command clang.exe
              $llvmBin = Split-Path $clang.Source
          }

          $llvmRoot = Split-Path $llvmBin
          $env:Path = "$llvmBin;$env:Path"
          $env:DM_LLVM = $llvmRoot

          "DM_LLVM=$llvmRoot" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          Write-Host "LLVM: $llvmRoot"
          clang --version

      - name: 修正源码路径并生成审计 TBD
        shell: pwsh
        run: |
          $env:DM_BASE_VER = $env:SHELL_TAG
          $env:DM_IPA_SRC = "$PWD\input\base.ipa"
          $env:DM_DIST = "$PWD\dist"
          $env:DM_ARROW_DYLIB = "$PWD\arrow\out\dmarrow.dylib"
          $env:DM_PHONE_DATA = "$PWD\resources\extracted\00-00000005.data"
          $env:DM_MANIFEST = "$PWD\resources\extracted\build_manifest.psv"
          $env:DM_RATES_OUT = "$PWD\cheat\out"

          @'
          import os
          import re
          from pathlib import Path

          root = Path.cwd()

          def patch(path, replacements):
              p = root / path
              s = p.read_text(encoding="utf-8-sig")

              for pattern, repl in replacements:
                  s, n = re.subn(
                      pattern,
                      repl,
                      s,
                      count=1,
                      flags=re.M
                  )
                  if n != 1:
                      raise SystemExit(
                          f"未能修补 {path}: {pattern}"
                      )

              p.write_text(s, encoding="utf-8")
              print("已修补:", path)

          patch("arrow/tools/build.py", [
              (
                  r"^LLVM\s*=.*$",
                  "LLVM = os.environ.get('DM_LLVM', r'C:/Program Files/LLVM')"
              ),
              (
                  r"^IPA_ROOT_DST\s*=.*$",
                  "IPA_ROOT_DST = os.path.join(os.environ.get('DM_DIST', 'dist'), 'D2RMobile-arrow.ipa')"
              ),
              (
                  r"^ROOT_DYLIB_DST\s*=.*$",
                  "ROOT_DYLIB_DST = os.path.join(os.environ.get('DM_DIST', 'dist'), 'dmarrow.dylib')"
              ),
              (
                  r"^OUT_IPA_NAME\s*=.*$",
                  "OUT_IPA_NAME = 'D2RMobile-arrow.ipa'"
              ),
          ])

          patch("cheat/tools/build_cheat.py", [
              (
                  r"^LLVM\s*=.*$",
                  "LLVM = os.environ.get('DM_LLVM', r'C:/Program Files/LLVM')"
              ),
              (
                  r"^PYTHON\s*=.*$",
                  "PYTHON = sys.executable"
              ),
              (
                  r"^BASE_VER\s*=.*$",
                  "BASE_VER = os.environ.get('DM_BASE_VER', 'v1.0.18')"
              ),
              (
                  r"^IPA_SRC\s*=.*$",
                  "IPA_SRC = os.environ.get('DM_IPA_SRC', 'input/base.ipa')"
              ),
              (
                  r"^IPA_ROOT_DST\s*=.*$",
                  "IPA_ROOT_DST = os.path.join(os.environ.get('DM_DIST', 'dist'), 'D2RMobile-' + BASE_VER + '-mods-1p.ipa')"
              ),
              (
                  r"^ROOT_DYLIB_DST\s*=.*$",
                  "ROOT_DYLIB_DST = os.path.join(os.environ.get('DM_DIST', 'dist'), 'dmcheat.dylib')"
              ),
              (
                  r"^ARROW_ROOT_DST\s*=.*$",
                  "ARROW_ROOT_DST = os.path.join(os.environ.get('DM_DIST', 'dist'), 'dmarrow.dylib')"
              ),
              (
                  r"^ARROW_DYLIB\s*=.*$",
                  "ARROW_DYLIB = os.environ.get('DM_ARROW_DYLIB', 'arrow/out/dmarrow.dylib')"
              ),
              (
                  r"^OUT_IPA_NAME\s*=.*$",
                  "OUT_IPA_NAME = 'D2RMobile-' + BASE_VER + '-mods-1p.ipa'"
              ),
          ])

          patch("cheat/tools/make_rates_overlay.py", [
              (
                  r"^PHONE_DATA\s*=.*$",
                  "PHONE_DATA = os.environ.get('DM_PHONE_DATA', 'resources/extracted/00-00000005.data')"
              ),
              (
                  r"^MANIFEST\s*=.*$",
                  "MANIFEST = os.environ.get('DM_MANIFEST', 'resources/extracted/build_manifest.psv')"
              ),
              (
                  r"^OUT\s*=.*$",
                  "OUT = os.environ.get('DM_RATES_OUT', os.path.abspath('cheat/out'))"
              ),
          ])

          p = root / "cheat/tools/build_cheat.py"
          s = p.read_text(encoding="utf-8")

          m = re.search(
              r"^SYM_LIBS\s*=\s*\{(.*?)^\}",
              s,
              re.S | re.M
          )

          if not m:
              raise SystemExit("没有找到 SYM_LIBS")

          pairs = re.findall(
              r"'(_[^']+)'\s*:\s*(LIB_\w+)",
              m.group(1)
          )

          files = {
              "LIB_SYSTEM": "libSystem.B.tbd",
              "LIB_OBJC": "libobjc.A.tbd",
              "LIB_FOUNDATION": "Foundation.tbd",
          }

          tbd_dir = root / "arrow/tools/ios27_tbds"
          tbd_dir.mkdir(parents=True, exist_ok=True)

          for lib, filename in files.items():
              syms = sorted({
                  sym
                  for sym, target in pairs
                  if target == lib
              })

              if not syms:
                  raise SystemExit(
                      f"SYM_LIBS 中没有 {lib} 的符号"
                  )

              target = tbd_dir / filename
              target.write_text(
                  "\n".join(syms) + "\n",
                  encoding="utf-8"
              )

              print(
                  f"生成审计 TBD: {target} ({len(syms)} 个符号)"
              )
          '@ | python -

      - name: 构建任务箭头 dylib
        shell: pwsh
        run: |
          $env:ARROW_DYLIB_ONLY = "1"
          $env:DM_IPA_SRC = "$PWD\input\base.ipa"

          if (-not $env:DM_LLVM) {
              $env:DM_LLVM = "C:\Program Files\LLVM"
          }

          python arrow/tools/build.py

      - name: 构建并注入金手指
        shell: pwsh
        run: |
          $env:DM_BASE_VER = $env:SHELL_TAG
          $env:DM_IPA_SRC = "$PWD\input\base.ipa"
          $env:DM_DIST = "$PWD\dist"
          $env:DM_ARROW_DYLIB = "$PWD\arrow\out\dmarrow.dylib"
          $env:DM_PHONE_DATA = "$PWD\resources\extracted\00-00000005.data"
          $env:DM_MANIFEST = "$PWD\resources\extracted\build_manifest.psv"
          $env:DM_RATES_OUT = "$PWD\cheat\out"

          if (-not $env:DM_LLVM) {
              $env:DM_LLVM = "C:\Program Files\LLVM"
          }

          python cheat/tools/build_cheat.py

      - name: 检查最终 IPA
        shell: pwsh
        run: |
          $ipa = Get-ChildItem "dist\*.ipa" | Select-Object -First 1

          if ($null -eq $ipa) {
              throw "dist 中没有生成 IPA"
          }

          if ($ipa.Length -lt 10MB) {
              throw "生成的 IPA 太小，可能构建失败"
          }

          Write-Host "最终 IPA：$($ipa.FullName)"
          Write-Host "大小：$([math]::Round($ipa.Length / 1MB, 2)) MB"

      - name: 上传构建产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d2r-mobile-mods
          path: |
            dist/*.ipa
            dist/*.dylib
          retention-days: 7
